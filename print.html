<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Imprimir QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  html,body{margin:0;background:#fff;color:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:16px;}
  .label{border:1px dashed #bbb;border-radius:8px;padding:12px 10px;
    width:170px;display:flex;flex-direction:column;align-items:center;text-align:center;
    break-inside:avoid;}
  .label .q{margin:2px auto}
  .label .q img, .label .q canvas{display:block}
  .label .cli{font-size:13px;font-weight:800;margin-top:8px;word-break:break-word;line-height:1.1}
  .label .cod{font-size:18px;font-weight:800;margin-top:2px}
  .label .imp{font-size:10px;font-weight:700;color:#c0392b;margin-top:4px}
  .hint{font-size:12px;color:#777;text-align:center;margin:10px}
  @media print{ .hint{display:none} .label{border-color:#ddd} @page{ margin:8mm } }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <div class="hint" id="hint">Si no se abrió el cuadro de impresión, usá el menú del navegador → Imprimir.</div>
<script>
  function gp(n){ try{ return new URLSearchParams(location.search).get(n);}catch(e){return null;} }
  var cli=gp("cli")||"", cod=gp("cod")||"", id=gp("id")||"", imp=gp("imp");
  var n=parseInt(gp("n")||"1",10); if(isNaN(n)||n<1)n=1; if(n>12)n=12;

  var data = "https://corrugadoseg-coder.github.io/troqueles-qr/?cli=" + encodeURIComponent(cli) +
             "&cod=" + encodeURIComponent(cod) + "&id=" + encodeURIComponent(id) +
             (imp==="1" ? "&imp=1" : "");

  var grid=document.getElementById("grid");
  for(var i=0;i<n;i++){
    var lab=document.createElement("div"); lab.className="label";
    var q=document.createElement("div"); q.className="q"; lab.appendChild(q);
    var c1=document.createElement("div"); c1.className="cli"; c1.textContent=cli; lab.appendChild(c1);
    var c2=document.createElement("div"); c2.className="cod"; c2.textContent= cod?("Caja "+cod):""; lab.appendChild(c2);
    if(imp==="1"){ var im=document.createElement("div"); im.className="imp"; im.textContent="⚠ Lleva impresión"; lab.appendChild(im); }
    grid.appendChild(lab);
    try{ new QRCode(q, { text:data, width:150, height:150, correctLevel:QRCode.CorrectLevel.M }); }
    catch(e){ q.textContent="QR?"; }
  }
  setTimeout(function(){ window.print(); }, 800);
</script>
</body>
</html>
