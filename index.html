<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Troquel · EG</title>
<style>
  :root{
    --bg:#f4f1ee; --card:#ffffff; --ink:#2b2320; --muted:#8a7f77; --line:#e6ded7;
    --accent:#e05a55; --brand-tan:#b0886a;
    --warn-bg:#fdecea; --warn-ink:#c04a44; --warn-line:#f3c0ba;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#171412; --card:#211d1a; --ink:#f3ede8; --muted:#b0a39a;
      --line:#3a332e; --brand-tan:#c79a78; --accent:#e86a64;
      --warn-bg:#2d1714; --warn-ink:#f0a79d; --warn-line:#5a2a23;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171412; --card:#211d1a; --ink:#f3ede8; --muted:#b0a39a;
    --line:#3a332e; --brand-tan:#c79a78; --accent:#e86a64;
    --warn-bg:#2d1714; --warn-ink:#f0a79d; --warn-line:#5a2a23;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:20px 16px;
  }
  .card{
    position:relative;width:100%;max-width:420px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;
    padding:26px 22px;box-shadow:0 2px 10px rgba(0,0,0,.07);
  }
  .logo-corner{
    position:absolute;top:16px;right:16px;width:56px;height:auto;
    background:#fff;border-radius:10px;padding:5px;
  }
  .eyebrow{
    color:var(--brand-tan);font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:1.6px;margin:0 0 16px;
  }
  .field{margin-bottom:22px;padding-right:72px}
  .field.full{padding-right:0}
  .field:last-of-type{margin-bottom:0}
  .label{
    font-size:13px;font-weight:800;color:var(--brand-tan);
    text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px;
  }
  .value{font-size:32px;font-weight:800;line-height:1.1;word-break:break-word}
  .value.cod{font-size:44px;letter-spacing:.5px}
  .warn{
    margin-top:22px;display:flex;align-items:center;gap:10px;
    background:var(--warn-bg);color:var(--warn-ink);
    border:1px solid var(--warn-line);border-radius:12px;
    padding:12px 14px;font-weight:700;font-size:15px;
  }
  .warn .ic{font-size:20px;line-height:1}
  .foot{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
  .demo{
    margin-top:12px;font-size:12px;color:var(--muted);
    background:var(--card);border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;text-align:center;max-width:420px;width:100%;
  }
  .hidden{display:none}
</style>
</head>
